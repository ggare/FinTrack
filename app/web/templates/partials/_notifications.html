<div class="mb-3 flex items-center justify-between">
  <h2 class="font-semibold text-slate-900">Уведомления</h2>
  {% if notifications %}
  <button hx-post="/notifications/read-all" hx-target="#notifications-panel" hx-swap="innerHTML"
          class="text-xs font-medium text-indigo-600 transition hover:text-indigo-500">
    Прочитать все
  </button>
  {% endif %}
</div>
{% for n in notifications %}
<div class="mb-2 rounded-xl border border-amber-200 bg-amber-50 p-3">
  <p class="text-xs font-semibold text-amber-800">{{ n.title }}</p>
  <p class="mt-1 text-xs leading-relaxed text-amber-700">{{ n.message }}</p>
</div>
{% else %}
<p class="text-xs leading-relaxed text-slate-400">
  Здесь появятся оповещения о превышении бюджетов (их создаёт фоновый воркер каждое утро).
</p>
{% endfor %}
