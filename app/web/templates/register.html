{% extends "auth.html" %}
{% block title %}Регистрация — FinTrack{% endblock %}
{% block card %}
<div class="w-full max-w-md rounded-3xl bg-white p-8 shadow-2xl">
  <div class="mb-6 flex items-center gap-3">
    <div class="grid h-11 w-11 place-items-center rounded-2xl bg-indigo-500 text-xl font-bold text-white">₽</div>
    <div>
      <h1 class="text-xl font-bold text-slate-900">Регистрация</h1>
      <p class="text-xs text-slate-500">это займёт меньше минуты</p>
    </div>
  </div>

  {% if error %}
  <div class="mb-4 rounded-xl bg-rose-50 px-4 py-3 text-sm text-rose-700">{{ error }}</div>
  {% endif %}

  <form method="post" action="/register" class="space-y-4">
    <div>
      <label for="username" class="mb-1 block text-sm font-medium text-slate-700">Имя пользователя</label>
      <input id="username" name="username" type="text" required minlength="3" maxlength="50"
             pattern="[a-zA-Z0-9_.\-]+" autocomplete="username"
             class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm outline-none transition focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100">
      <p class="mt-1 text-xs text-slate-400">Латиница, цифры, точки и дефисы</p>
    </div>
    <div>
      <label for="email" class="mb-1 block text-sm font-medium text-slate-700">Email</label>
      <input id="email" name="email" type="email" required autocomplete="email"
             class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm outline-none transition focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100">
    </div>
    <div>
      <label for="password" class="mb-1 block text-sm font-medium text-slate-700">Пароль</label>
      <input id="password" name="password" type="password" required minlength="8" autocomplete="new-password"
             class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm outline-none transition focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100">
      <p class="mt-1 text-xs text-slate-400">Минимум 8 символов</p>
    </div>
    <button type="submit"
            class="w-full rounded-xl bg-indigo-600 py-2.5 text-sm font-semibold text-white transition hover:bg-indigo-500">
      Создать аккаунт
    </button>
  </form>

  <p class="mt-6 text-center text-sm text-slate-500">
    Уже есть аккаунт?
    <a href="/login" class="font-medium text-indigo-600 hover:text-indigo-500">Войти</a>
  </p>
</div>
{% endblock %}
