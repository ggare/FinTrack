{% extends "auth.html" %}
{% block title %}Вход — FinTrack{% endblock %}
{% block card %}
<div class="w-full max-w-md rounded-3xl bg-white p-8 shadow-2xl">
  <div class="mb-6 flex items-center gap-3">
    <div class="grid h-11 w-11 place-items-center rounded-2xl bg-indigo-500 text-xl font-bold text-white">₽</div>
    <div>
      <h1 class="text-xl font-bold text-slate-900">FinTrack</h1>
      <p class="text-xs text-slate-500">войдите, чтобы продолжить</p>
    </div>
  </div>

  {% if error %}
  <div class="mb-4 rounded-xl bg-rose-50 px-4 py-3 text-sm text-rose-700">{{ error }}</div>
  {% endif %}

  <form method="post" action="/login" class="space-y-4">
    <div>
      <label for="email" class="mb-1 block text-sm font-medium text-slate-700">Email</label>
      <input id="email" name="email" type="email" required autofocus autocomplete="email"
             class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm outline-none transition focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100">
    </div>
    <div>
      <label for="password" class="mb-1 block text-sm font-medium text-slate-700">Пароль</label>
      <input id="password" name="password" type="password" required autocomplete="current-password"
             class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm outline-none transition focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100">
    </div>
    <button type="submit"
            class="w-full rounded-xl bg-indigo-600 py-2.5 text-sm font-semibold text-white transition hover:bg-indigo-500">
      Войти
    </button>
  </form>

  <p class="mt-6 text-center text-sm text-slate-500">
    Нет аккаунта?
    <a href="/register" class="font-medium text-indigo-600 hover:text-indigo-500">Зарегистрируйтесь</a>
  </p>
  <p class="mt-4 rounded-xl bg-slate-50 px-4 py-3 text-center text-xs text-slate-500">
    Демо-доступ: <b>demo@fintrack.dev</b> / <b>demo1234</b>
  </p>
</div>
{% endblock %}
